<!DOCTYPE html>  
<html lang="pt-BR">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Clientes</title>  
    <style>  
        body { font-family: Arial, sans-serif; margin: 20px; }  
        form { max-width: 600px; margin: auto; }  
        label { display: block; margin-top: 10px; }  
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }  
        input[type="submit"] {  
            margin-top: 20px; padding: 10px 20px;  
            background-color: #4c74af; color: white; border: none; cursor: pointer;  
        }  
        .message { margin-top: 20px; color: red; text-align: center; }  
        h1, h2 { text-align: center; }  
        table { width: 100%; border-collapse: collapse; max-width: 700px; margin: 30px auto; }  
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }  
        th { background-color: #4c74af; color: white; }  
    </style>  
</head>  
<body>  
    <h1>Cadastro de Cliente</h1>  
    <form id="clientForm">  
        <label for="nome">Nome:</label>  
        <input type="text" id="nome" name="nome" required><br>  
        <label for="cpf">CPF:</label>  
        <input type="text" id="cpf" name="cpf" required><br><br>  
        <input type="submit" value="Cadastrar Cliente">  
    </form>  
  
    <h2>Lista de Clientes</h2>  
    <div id="message" class="message"></div>  
    <table id="clientTable">  
        <thead>  
            <tr><th>ID</th><th>Nome</th><th>CPF</th></tr>  
        </thead>  
        <tbody id="clientTableBody"></tbody>  
    </table>  
  
    <script>  
        async function loadClients() {  
            const messageElement = document.getElementById('message');  
            const tbody = document.getElementById('clientTableBody');  
            try {  
                const response = await fetch('/api/clientes');  
                if (response.ok) {  
                    const clientes = await response.json();  
                    tbody.innerHTML = '';  
                    clientes.forEach(cliente => {  
                        const row = document.createElement('tr');  
                        row.innerHTML = `  
                            <td>${cliente.id}</td>  
                            <td>${cliente.nome}</td>  
                            <td>${cliente.cpf}</td>  
                        `;  
                        tbody.appendChild(row);  
                    });  
                } else {  
                    const errorData = await response.json();  
                    messageElement.textContent = `Erro: ${errorData.error}`;  
                }  
            } catch (error) {  
                messageElement.textContent = 'Erro ao carregar clientes.';  
                console.error('Erro:', error);  
            }  
        }  
  
        function addPerson(event) {  
            event.preventDefault();  
            const nome = document.getElementById('nome').value;  
            const cpf = document.getElementById('cpf').value;  
  
            fetch('api/clientes', {  
                method: 'POST',  
                headers: { 'Content-Type': 'application/json' },  
                body: JSON.stringify({ nome, cpf })  
            })  
            .then(response => response.json())  
            .then(data => {  
                alert('Cliente cadastrado com sucesso:' + JSON.stringify(data));  
                document.getElementById('nome').value = "";  
                document.getElementById('cpf').value = "";  
                loadClients();  
            })  
            .catch(error => {  
                console.error('Erro:', error);  
                alert('Erro ao cadastrar cliente.');  
            });  
        }  
  
        document.getElementById('clientForm').addEventListener('submit', addPerson);  
        loadClients();  
    </script>  
</body>  
</html>
