<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Cliente</title>
     <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            max-width: 600px;
            margin: auto;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        input[type="submit"]{
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4c74af;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color:  #4c74af;
        }
        .message {
            margin-top: 20px;
            color: red;
        }
        h1{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Cadastro de Cliente</h1>
    <form id="clientForm">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" required><br><br>
        <input type="submit" value="Cadastrar Cliente">
    </form>


    
</body>
</html>
