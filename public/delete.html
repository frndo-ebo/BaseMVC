<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Cliente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input[type="text"], button {
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Excluir Cliente</h1>
    <label for="clientId">ID do Cliente:</label>
    <input type="text" id="clientId" placeholder="Digite o ID do cliente">
    <button id="deleteBtn">Excluir Cliente</button>
    <p id="message"></p>

    <script>
    document.getElementById('deleteBtn').addEventListener('click', async ()=>{
        const clienteId = document.getElementById('clientId').value;
        const messageElement = document.getElementById('message');

        if(!clienteId){
            messageElement.textContent = 'Por favor, insira um ID.'
            return;
        }
        try {
            
            const response = await fetch(`/api/clientes/${clienteId}`,
            {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if(response.ok){
                messageElement.textContent = 'Cliente excluido com sucesso!';
            }else{
                const errorData = await response.json();
                messageElement.textContent = `Erro: ${errorData.error}`;
            }

        } catch (error) {
            messageElement.textContent = 'Erro ao excluir cliente.';
            console.error('Erro:', error);
        }
    })
</script>

</body>
</html>
